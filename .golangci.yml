# golangci-lint v2 config for hexx-pep-core (public).
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  settings:
    staticcheck:
      # Quick-fix style suggestions (QF*) are not defects.
      checks: ["all", "-QF*", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
  exclusions:
    rules:
      - text: "Error return value of .*Close.* is not checked"
        linters:
          - errcheck
